<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="適性検査">
<meta name="theme-color" content="#1f4e8c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>適性検査トレーニング</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1d2433;--sub:#5b6577;--line:#dfe3ec;--main:#1f4e8c;--main2:#e8f0fb;--ok:#1b7f4b;--ng:#c0392b;--warn:#b26a00;--star:#e0a100}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--ink:#eef1f7;--sub:#9aa5ba;--line:#2c354a;--main:#6aa5f0;--main2:#1c2a44;--ok:#4cc38a;--ng:#ff7b6b;--warn:#f0b34d;--star:#f0c24d}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:19px;line-height:1.75;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font-size:20px;margin:0;flex:1;line-height:1.3}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 18px;min-height:46px;cursor:pointer;touch-action:manipulation}
button.primary{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
button.ghost{border-color:transparent;background:transparent;color:var(--main);font-weight:700}
button.small{min-height:38px;padding:4px 14px;font-size:16px}
button:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.fig{display:block;width:100%;max-width:420px;height:auto;margin:8px auto;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tile{display:block;text-align:left;width:100%;padding:18px}
.tile b{display:block;font-size:21px}.tile span{color:var(--sub);font-size:16px}
h2{font-size:21px;margin:22px 0 8px}h3{font-size:19px;margin:0 0 6px}
.muted{color:var(--sub);font-size:16px}
.stars{color:var(--star);letter-spacing:1px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.badge{display:inline-block;font-size:14px;border-radius:999px;padding:1px 10px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.badge.good{color:var(--ok);border-color:var(--ok)}.badge.mid{color:var(--warn);border-color:var(--warn)}.badge.bad{color:var(--ng);border-color:var(--ng)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:10px;padding:14px 16px}
.item .t{flex:1}
table{border-collapse:collapse;margin:8px 0;font-size:17px}th,td{border:1px solid var(--line);padding:6px 12px;text-align:center}th{background:var(--main2)}
.passage{background:var(--main2);border-radius:12px;padding:6px 18px;margin:10px 0}
.q{margin:18px 0;padding:16px 18px}
.q .qn{display:inline-block;background:var(--main);color:#fff;border-radius:8px;padding:0 10px;margin-right:8px;font-weight:700}
textarea{width:100%;min-height:110px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);resize:vertical}
textarea.out{min-height:220px;font-size:15px;line-height:1.5}
.cnt{text-align:right;font-size:14px;color:var(--sub)}.cnt.over{color:var(--ng);font-weight:700}
.ans{display:none;margin-top:12px;border-top:2px dashed var(--line);padding-top:12px}
.revealed .ans{display:block}
.ans .model{background:var(--main2);border-radius:10px;padding:8px 14px}
.verdict{font-weight:700;margin:2px 0 8px}.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}.verdict.na{color:var(--sub);font-weight:400;font-size:16px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;min-height:44px}
.chk input{width:26px;height:26px;margin-top:3px;flex:none}
.chk .pt{margin-left:auto;color:var(--sub);white-space:nowrap}
.score{font-size:22px;font-weight:700}
.bar{height:16px;background:var(--line);border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--main)}
.tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;color:var(--main)}.timer.low{color:var(--ng)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:8;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:999px;background:var(--main);color:#fff;border:0;padding:12px 22px;font-weight:700}
#pad{position:fixed;left:0;right:0;bottom:0;height:52vh;z-index:9;background:var(--card);border-top:2px solid var(--main);display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#pad.open{display:flex}
#pad .tb{display:flex;gap:8px;align-items:center;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#padc{flex:1;width:100%;touch-action:none;background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px)}
.pill{display:inline-block;width:26px;height:26px;border-radius:50%;border:3px solid transparent;vertical-align:middle}
.pill.on{border-color:var(--main)}
.note{font-size:15px;color:var(--sub)}
.sub{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sub:last-child{border-bottom:0}.sub .t{flex:1}
.msg{padding:10px 14px;border-radius:12px;background:var(--main2);margin-top:10px}
.msg.err{color:var(--ng)}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <button class="ghost" id="back" aria-label="戻る">‹ 戻る</button>
  <h1 id="ttl">適性検査トレーニング</h1>
  <span id="hdr"></span>
</header>
<main id="app"></main>

<button class="fab hide" id="fab">✏️ メモ</button>
<section id="pad" aria-label="手書きメモ">
  <div class="tb">
    <b>計算用メモ</b>
    <span id="cols"></span>
    <button id="undo">1つ戻す</button>
    <button id="clr">全部消す</button>
    <label class="note"><input type="checkbox" id="fing"> 指でも書く</label>
    <span class="spacer"></span>
    <button class="primary" id="padx">閉じる</button>
  </div>
  <canvas id="padc"></canvas>
</section>

<script src="problems.js"></script>
<script src="mocks.js"></script>
<script src="buddy.js"></script>
<script>
"use strict";
const P = window.PROBLEMS || [];
const LS = "tekisei_v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SUBN = {I:"適性検査Ⅰ（算数・理科）", II:"適性検査Ⅱ（国語・社会）"};
let db = (() => { let raw = null; try { raw = localStorage.getItem(LS); return JSON.parse(raw) || {}; } catch(e) { if (raw) { try { localStorage.setItem(LS + "_broken_" + Date.now(), raw); } catch(_) {} window.__loadBroken = true; } return {}; } })();
db.results = db.results || []; db.mocks = db.mocks || []; db.subs = db.subs || [];
function persist(){ try { localStorage.setItem(LS, JSON.stringify(db)); } catch(e) {} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate(); };
const PM = window.MOCKS || [];   // 模擬試験専用の問題（練習問題とは別）
const byId = id => P.find(p => p.id === id) || PM.find(p => p.id === id);
const mfield = p => String(p.unit).replace(/（.*）/, "");
const qMax = q => q.rubric.reduce((a,r) => a + r[1], 0);
const maxOf = p => p.qs.reduce((a,q) => a + qMax(q), 0);
const lastOf = pid => { const r = db.results.filter(x => x.pid === pid); return r[r.length-1]; };
const stars = n => '<span class="stars" aria-label="難度'+n+'">'+"★".repeat(n)+"☆".repeat(4-n)+'</span>';
const pctCls = v => v >= 80 ? "good" : v >= 60 ? "mid" : "bad";
const pct = r => Math.round(r.score / r.max * 100);
function badge(pid){ const r = lastOf(pid); const L = window.Buddy ? Buddy.lap() : 1; return r ? '<span class="badge '+pctCls(pct(r))+'">'+((r.lap||1) < L ? "前の周 " : "前回 ")+r.score+'/'+r.max+'点</span>' : '<span class="badge">未着手</span>'; }
const nPend = (m) => db.subs.filter(s => s.state === "pending" && !!s.mock === !!m).length;
const nSent = (m) => db.subs.filter(s => s.state === "sent" && !!s.mock === !!m).length;

let timerId = null, cur = null;
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }
function setHdr(h){ $("#hdr").innerHTML = h || ""; }
function title(t){ $("#ttl").textContent = t; document.title = t + "｜適性検査トレーニング"; }
function showFab(on){ $("#fab").classList.toggle("hide", !on); if (!on) $("#pad").classList.remove("open"); }

/* ---------- 自動判定（数字・短い答えだけ。仮判定） ---------- */
const normT = s => String(s).normalize("NFKC").toLowerCase().replace(/[\s　、。，．・「」『』（）()→―\-,.\u200b-\u200d\ufeff]/g, "").normalize("NFKC");
const fold1 = c => c.replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60)).replace(/[ぁぃぅぇぉ]/g, ch => "あいうえお"["ぁぃぅぇぉ".indexOf(ch)]).replace("工", "え").replace("夕", "た");
function judge(q, input){
  const a = q.auto; if (!a) return null;
  const s = String(input || "").trim();
  if (a.t === "multi") {
    const single = a.parts.every(p => p.every(x => normT(x).length === 1)) && normT(s).length <= a.parts.length * 2;   // ア〜エだけを並べる設問
    const nz = single ? (x => fold1(normT(x))) : normT;
    const n = nz(s); let pos = -1;
    const keys = a.parts.map(p => p.map(nz).join("|"));
    if (a.ordered && new Set(keys).size < keys.length) {
      // 同じ語が何度も出る設問（縄文／弥生など）：答えの語を前から全部ひろい、n番目どうしを比べる
      const cand = []; a.parts.forEach((p, i) => p.forEach(x => cand.push([nz(x), keys[i]])));
      cand.sort((x, y) => y[0].length - x[0].length);
      const toks = []; let i = 0;
      while (i < n.length) { const m = cand.find(c => c[0] && n.startsWith(c[0], i)); if (m) { toks.push(m[1]); i += m[0].length; } else i++; }
      return a.parts.map((p, k) => toks[k] === keys[k]);
    }
    return a.parts.map(p => {
      if (!s) return false;
      let best = -1;
      for (const x of p) { const i = n.indexOf(nz(x), a.ordered ? pos + 1 : 0); if (i >= 0 && (best < 0 || i < best)) best = i; }
      if (best >= 0) { if (a.ordered) pos = best; return true; }
      return false;
    });
  }
  if (!s) return false;
  if (a.t === "num") { const m = s.normalize("NFKC").replace(/,/g, "").replace(/(?:cm|㎝|m|ｍ|km|g|kg|L|l|mL|ml|円|個|人|度|分|秒|時間|枚|本|冊|点|倍|％|%)[2２3３²³]?/g, "").match(/-?\d+(?:\.\d+)?/g); return !!m && Math.abs(parseFloat(m[m.length-1]) - a.v) < 1e-9; }
  const n = normT(s);
  // 記号（ア〜エ）1文字の答え：ひらがな・小さい文字・似た漢字もゆるして正解にする
  if (n.length === 1 && (a.t === "text" || a.t === "has") && a.ok.some(x => normT(x).length === 1 && fold1(normT(x)) === fold1(n))) return true;
  if (a.t === "text") return a.ok.some(x => normT(x) === n);
  if (a.t === "has") return a.ok.some(x => n.includes(normT(x)));
  return null;
}
const collect = pi => cur.ps[pi].qs.map((q,i) => { const t = document.querySelector('textarea[data-ans="'+pi+'_'+i+'"]'); return t ? t.value : ""; });

/* ---------- 画面 ---------- */
function home(){
  if (window.Buddy) setTimeout(() => Buddy.check(), 400);
  title("適性検査トレーニング"); setHdr(""); showFab(false);
  const n = db.results.length, pe = nPend(), se = nSent(), mpe = nPend(true), mse = nSent(true);
  $("#app").innerHTML = `
  ${window.__loadBroken ? '<div class="msg">保存データを読み込めませんでした。元のデータはバックアップとして残してあります。お手数ですが、保護者の方にお知らせください。</div>' : ""}
  ${window.Buddy ? Buddy.card() : ""}
  <p class="muted">岡山県立中学校の適性検査に備える練習アプリです。（問題は全てオリジナルです）</p>
  <h2>練習</h2>
  <div class="grid">
    <button class="card tile" data-go="#list/math"><b>算数</b><span>${cntOf("math")}</span></button>
    <button class="card tile" data-go="#list/science"><b>理科</b><span>${cntOf("science")}</span></button>
    <button class="card tile" data-go="#list/japanese"><b>国語</b><span>${cntOf("japanese")}</span></button>
    <button class="card tile" data-go="#list/society"><b>社会</b><span>${cntOf("society")}</span></button>
  </div>
  <h2>適性検査 模擬試験</h2>
  <div class="grid">
    <button class="card tile" data-go="#mock/I"><b>適性検査Ⅰ</b><span>算数・理科の3課題（45分）</span></button>
    <button class="card tile" data-go="#mock/II"><b>適性検査Ⅱ</b><span>国語・作文・社会の3課題（45分）</span></button>
  </div>
  <div class="grid">
    <button class="card tile" data-go="#mscore"><b>模擬試験の採点${mpe||mse ? '　<span class="badge bad">送信待ち '+mpe+'・採点待ち '+mse+'</span>' : ""}</b><span>模擬試験の答案を送り、結果を入れる</span></button>
  </div>
  <h2>練習の採点（親に送る・採点を受け取る）</h2>
  <div class="grid">
    <button class="card tile" data-go="#inbox"><b>送信・採点${pe||se ? '　<span class="badge bad">送信待ち '+pe+'・採点待ち '+se+'</span>' : ""}</b><span>解いた問題をまとめて送り、結果を入れる</span></button>
  </div>
  <h2>振り返り</h2>
  <div class="grid">
    <button class="card tile" data-go="#review"><b>復習リスト</b><span>点が取れなかった問題をもう一度</span></button>
  </div>
  <p class="note" id="homeNote" style="margin-top:28px;user-select:none;-webkit-user-select:none">記録はこのiPadの中だけに保存されます。ブラウザのデータを消すと記録も消えます。</p><div id="parentBox"></div>`;
  // 保護者メニュー：この注意書きを3秒以内に5回タップすると出る（子どもの目にふれにくくする）
  let tn = 0, t0 = 0;
  $("#homeNote").onclick = () => { const now = Date.now(); if (now - t0 > 3000) tn = 0; t0 = now; if (++tn >= 5) { tn = 0; window.__parent = true; $("#parentBox").innerHTML = `<h2>保護者メニュー</h2><div class="grid"><button class="card tile" data-go="#weak"><b>得意・不得意（練習）</b><span>分野ごとの得点率</span></button><button class="card tile" data-go="#stats"><b>成績（練習）</b><span>${n}回分の記録</span></button><button class="card tile" data-go="#mweak"><b>模擬試験の弱点分析</b><span>${db.mocks.filter(m => m.tasks && !m.partial).length}回分の記録</span></button></div><div class="row" style="margin-top:8px"><button id="parentHide">メニューを閉じる</button></div>`; $("#parentHide").onclick = () => { window.__parent = false; $("#parentBox").innerHTML = ""; }; $("#parentBox").scrollIntoView({behavior:"smooth", block:"center"}); } };
}

const SUBJT = {math:"算数", science:"理科", japanese:"国語", society:"社会"};
function cntOf(k){ const ps = P.filter(p => Buddy.subjOf(p) === k); const L = Buddy.lap(); const d = ps.filter(p => db.results.some(r => r.pid === p.id && (r.lap || 1) === L)).length; return d + " / " + ps.length + " 問 取り組み済み"; }
function list(sub){
  title(SUBJT[sub] || SUBN[sub]); setHdr(""); showFab(false);
  const ps = P.filter(p => SUBJT[sub] ? Buddy.subjOf(p) === sub : p.sub === sub);
  const groups = {};
  ps.forEach(p => (groups[p.unit] = groups[p.unit] || []).push(p));
  let h = '<p class="muted">問題を選んでください。★が多いほど難しい問題です。</p>';
  for (const u in groups) {
    h += '<h2>'+esc(u)+'</h2>';
    groups[u].forEach(p => { h += `<button class="card item" data-go="#p/${p.id}"><span class="t"><b>${esc(p.title)}</b><br><span class="muted">${esc(p.pat)} ・ ${maxOf(p)}点</span></span>${stars(p.star)}${badge(p.id)}</button>`; });
  }
  $("#app").innerHTML = h;
}

function qHTML(p, pi){
  return p.qs.map((q,i) => `
  <div class="card q" data-q="${i}">
    <div><span class="qn">${i+1}</span>${q.q}</div>
    <textarea data-ans="${pi}_${i}" rows="${q.essay?8:3}" placeholder="${q.essay?'ここに200字以内で書こう':'ここに答えを書こう（式や考え方も）'}" ${q.essay?'maxlength="400"':''}></textarea>
    ${q.max ? `<div class="cnt" data-cnt="${pi}_${i}" data-max="${q.max}">0 / ${q.max}字</div>` : ""}
    <div class="ans">
      <div class="verdict na" data-v="${pi}_${i}"></div>
      <div class="model"><b>答えの例</b><br>${esc(q.ans)}</div>
      <p class="muted" style="margin:8px 0 2px">自分の答えに当てはまる所に ✓ を付けよう（やり方が違っても、考え方が合っていれば付けてOK）</p>
      ${q.rubric.map((r,j) => `<label class="chk"><input type="checkbox" data-pi="${pi}" data-qi="${i}" data-ri="${j}" data-pt="${r[1]}"><span>${esc(r[0])}</span><span class="pt">${r[1]}点</span></label>`).join("")}
      <p class="muted"><b>ポイント</b>　${esc(q.exp)}</p>
    </div>
  </div>`).join("");
}
const sceneHTML = p => `<div class="card"><h3>${esc(p.title)}　${stars(p.star)}</h3>${p.scene}</div>`;

function bindPanel(root){
  root.addEventListener("input", e => {
    const t = e.target;
    if (t.matches("textarea[data-ans]")) {
      const c = root.querySelector('[data-cnt="'+t.dataset.ans+'"]');
      if (c) { const n = [...t.value.replace(/\n/g,"")].length, m = +c.dataset.max; c.textContent = n+" / "+m+"字"; c.classList.toggle("over", n > m); }
    }
  });
  root.addEventListener("change", e => { if (e.target.matches('input[type=checkbox][data-pi]')) updScore(); });
}
function scoreOf(pi){
  const p = cur.ps[pi]; let s = 0; const items = p.qs.map(() => 0);
  document.querySelectorAll('input[data-pi="'+pi+'"]:checked').forEach(c => { s += +c.dataset.pt; items[+c.dataset.qi] += +c.dataset.pt; });
  return {score:s, max:maxOf(p), items};
}
function updScore(){
  if (!cur) return;
  let s = 0, m = 0; cur.ps.forEach((p,i) => { const r = scoreOf(i); s += r.score; m += r.max; });
  const el = $("#sc"); if (el) el.innerHTML = '合計 <span class="score">'+s+'</span> / '+m+' 点（'+Math.round(s/m*100)+'％）';
}
// 自動で判定できる設問は、仮判定を表示して✓を先に入れる（自分で直せる）
function applyAuto(){
  cur.ps.forEach((p,pi) => {
    const ans = collect(pi);
    p.qs.forEach((q,qi) => {
      const v = document.querySelector('[data-v="'+pi+'_'+qi+'"]'); if (!v) return;
      const r = judge(q, ans[qi]);
      const boxes = [...document.querySelectorAll('input[data-pi="'+pi+'"][data-qi="'+qi+'"]')];
      if (r === null) { v.className = "verdict na"; v.textContent = "（自動判定なし：答えの例と見比べて✓を付けよう）"; return; }
      if (Array.isArray(r)) {
        boxes.forEach((b,j) => { b.checked = !!r[j]; });
        const k = r.filter(Boolean).length;
        v.className = "verdict " + (k === r.length ? "ok" : "ng");
        v.textContent = "仮判定：" + k + " / " + r.length + " 個が合っていそう";
      } else {
        boxes.forEach(b => { b.checked = r; });
        v.className = "verdict " + (r ? "ok" : "ng");

function mockRecompute(rec){
  const need = PM.filter(p => p.sub === rec.sub && p.set === rec.setId).length;
  rec.score = rec.tasks.reduce((a,t) => a + t.score, 0); rec.max = rec.tasks.reduce((a,t) => a + t.max, 0);
  rec.partial = need > 0 && rec.tasks.length < need;   // 課題がそろうまでは「一部のみ」
  rec.pct = rec.max ? Math.round(rec.score / rec.max * 100) : 0; rec.pt70 = rec.max ? Math.round(rec.score / rec.max * 70) : 0;

  if (!t) { t = {pid: p.id}; rec.tasks.push(t); }
  else if (!t.parent && t.items) t.self = {score: t.score, items: t.items};
  t.parent = true; t.score = score; t.max = tot; t.items = items;
  mockRecompute(rec);
}
function applyResult(raw, mock){

  body.split(/[;；]/).map(x => x.trim()).filter(Boolean).forEach(ent => {
    const mm = ent.match(/^([A-Za-z0-9\-]+)\s*=\s*([0-9.,\s]+)$/);
    if (!mm) { ng.push("読み取れません：" + ent); return; }
    const p = byId(mm[1]); if (!p) { ng.push("問題が見つかりません：" + mm[1]); return; }
    if (PM.some(x => x.id === p.id) !== !!mock) { ng.push(p.title + "：" + (mock ? "これは練習問題です。ホームの「送信・採点」に入れてください" : "これは模擬試験の問題です。ホームの「模擬試験の採点」に入れてください")); return; }
    const nums = mm[2].split(",").map(x => x.trim()).filter(x => x !== "").map(Number);
    const qm = p.qs.map(qMax), tot = qm.reduce((a,b) => a + b, 0);
    let items;
    if (nums.length === qm.length) items = nums.map((v,i) => Math.max(0, Math.min(v, qm[i])));
    else if (nums.length === 1) { let rest = Math.max(0, Math.min(nums[0], tot)); items = qm.map(x => { const v = Math.min(x, rest); rest -= v; return v; }); }
    else { ng.push(p.title + "：得点の数が合いません（設問は" + qm.length + "つ）"); return; }
    if (items.some(v => isNaN(v))) { ng.push(p.title + "：数字が読み取れません"); return; }
    const score = items.reduce((a,b) => a + b, 0);
    const cand = db.subs.filter(s => s.pid === p.id && s.state !== "graded"); let sub = cand[cand.length-1] || null;
    if (!sub) { const g = db.subs.filter(s => s.pid === p.id && s.state === "graded"); sub = g[g.length-1] || null; }
    if (mock) {
      mockGrade(p, sub, items, score, tot); if (sub) { sub.state = "graded"; sub.score = score; sub.max = tot; }

      else db.results.push({lap:lapN, pid:p.id, date:d, score:r.score, max:r.max, mode:cur.mode, src:"self", items:r.items, sid:sub.id}); });
    if (cur.mode === "mock") db.mocks.push({id:cur.mid, date:d, sub:cur.sub, setId:cur.setId, score:S, max:M, pt70:Math.round(S/M*70), pct:Math.round(S/M*100), used:cur.used, lap:lapN, src:"self", tasks});
    persist(); if (window.Buddy) { if (cur.mode === "mock") Buddy.mockDone(cur.sub, cur.setId); else Buddy.complete(cur.ps.map(p => p.id), {self:true}); }
    cur.saved = true; e.target.disabled = true; e.target.textContent = "記録しました ✓";
    afterQueued();
  }
});

/* ---------- 手書きメモ ---------- */
(() => {
  const cv = $("#padc"), ctx = cv.getContext("2d"); let strokes = [], curS = null, color = "#1d2433";
  const COLS = ["#1d2433", "#d6342a", "#1f6fd1"];
  $("#cols").innerHTML = COLS.map((c,i) => `<button data-c="${c}" aria-label="色${i+1}" style="padding:4px 8px;min-height:40px"><span class="pill ${i?'':'on'}" style="background:${c}"></span></button>`).join("");
  $("#cols").onclick = e => { const b = e.target.closest("[data-c]"); if (!b) return; color = b.dataset.c; document.querySelectorAll("#cols .pill").forEach(x => x.classList.remove("on")); b.querySelector(".pill").classList.add("on"); };
  function size(){ const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = Math.max(1, r.width*dpr); cv.height = Math.max(1, r.height*dpr); redraw(); }
  function draw(s){ if (s.pts.length < 1) return; const dpr = window.devicePixelRatio || 1; ctx.strokeStyle = s.c; ctx.lineWidth = 2.6*dpr; ctx.lineCap = ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(s.pts[0][0]*dpr, s.pts[0][1]*dpr); if (s.pts.length === 1) ctx.lineTo(s.pts[0][0]*dpr+.1, s.pts[0][1]*dpr); s.pts.slice(1).forEach(p => ctx.lineTo(p[0]*dpr, p[1]*dpr)); ctx.stroke(); }
  function redraw(){ ctx.clearRect(0,0,cv.width,cv.height); strokes.forEach(draw); }
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => { if (e.pointerType === "touch" && !$("#fing").checked) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); curS = {c:color, pts:[pos(e)]}; strokes.push(curS); draw(curS); });
  cv.addEventListener("pointermove", e => { if (!curS) return; e.preventDefault(); const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e]; (evs.length ? evs : [e]).forEach(ev => curS.pts.push(pos(ev))); redraw(); });
  const end = () => { curS = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  $("#undo").onclick = () => { strokes.pop(); redraw(); };
  $("#clr").onclick = () => { strokes = []; redraw(); };
  $("#fab").onclick = () => { $("#pad").classList.add("open"); size(); };
  $("#padx").onclick = () => $("#pad").classList.remove("open");
  addEventListener("resize", () => { if ($("#pad").classList.contains("open")) size(); });
})();

/* ---------- 起動 ---------- */
route();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
